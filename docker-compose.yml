services:
  dotcom:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADDR: :8080
      OUTPUT_DIR: public
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dotcom
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-hello@shinjustin.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
